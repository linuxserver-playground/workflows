# Generated by builder from image.yml. Do not edit; the shared workflow rewrites this file.
# The trusted half of pull request builds: it runs from this branch, never from the pull request, and only
# reads the Build run's artifacts as data. It posts the report comment, publishes a fork's image once a
# maintainer adds the safe-to-publish label, and deletes the pull request's images when it closes.

name: PR report

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
  pull_request_target:
    types: [labeled, synchronize, closed]

permissions: {}

jobs:
  report:
    uses: linuxserver-playground/workflows/.github/workflows/pr-report.yml@v1
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
      packages: write
    with:
      workflows_ref: v1
    secrets: inherit
