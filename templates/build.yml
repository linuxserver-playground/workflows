# Generated by builder from image.yml. Do not edit; the shared workflow rewrites this file.
# Every build of this repository runs linuxserver-playground/workflows image-build.yml@v1.

name: Build

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this build runs
        type: choice
        options: [manual, upstream, packages, rebuild]
        default: manual
  repository_dispatch:
    types: [build]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: linuxserver-playground/workflows/.github/workflows/image-build.yml@v1
    permissions:
      contents: write
      packages: write
      actions: write
      pull-requests: write
      id-token: write
      attestations: write
    with:
      reason: ${{ github.event.inputs.reason || github.event.client_payload.reason || 'push' }}
      workflows_ref: v1
    secrets: inherit
