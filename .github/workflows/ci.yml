name: CI

# Checks of this repository itself: shellcheck, actionlint and the pytest suite.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -e '.[dev]'
      - name: Check
        run: ./scripts/check.sh
