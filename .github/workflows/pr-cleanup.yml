name: PR cleanup

# Delete the untrusted-pr images of a closed pull request. Call it from an image or mods repo on
# pull_request closed. The package is untrusted-pr/<name> (image repos) or untrusted-pr/mods; every
# version carrying a tag of that pull request (pr-<n>-*, or *-pr-<n> for mods) is removed.
#
# Deleting package versions needs a token with delete:packages on the organisation. GITHUB_TOKEN
# cannot do that today, so the caller passes PACKAGES_TOKEN (an org secret held by the control
# plane's GitHub App installation, or a fine-grained token). Without it the job explains and exits 0.

on:
  workflow_call:
    inputs:
      package:
        description: Package name under the organisation, e.g. untrusted-pr/sonarr (default derived from the repo name)
        type: string
        default: ""
      pr_number:
        description: Pull request number (defaults to the closing pull_request event's number)
        type: string
        default: ""
      workflows_ref:
        type: string
        default: v1
    secrets:
      PACKAGES_TOKEN:
        required: false

jobs:
  cleanup:
    name: Delete PR images
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Check out shared workflows
        uses: actions/checkout@v5
        with:
          repository: linuxserver-playground/workflows
          ref: ${{ inputs.workflows_ref }}
          path: .lsio-workflows
          persist-credentials: false

      - name: Delete package versions
        run: |
          set -euo pipefail
          org="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          package="${PACKAGE:-untrusted-pr/${repo#docker-}}"
          python3 .lsio-workflows/scripts/pr_cleanup.py --org "${org}" --package "${package}" --pr "${PR_NUMBER}"
        env:
          PACKAGE: ${{ inputs.package }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN || github.token }}
