name: test-arch
description: Run the ci container against a locally present image and collect the per-arch bundle files.

inputs:
  image:
    description: Image reference present in the local docker daemon
    required: true
  arch:
    required: true
  mode:
    required: true
  manifest:
    description: Path to image.yml as compact JSON (the prepare job's manifest artifact)
    required: true
  previous_packages_url:
    description: URL of the previous release's package_versions.<arch>.txt (optional)
    default: ""
  ci_image:
    default: ghcr.io/linuxserver-playground/ci:latest
  dumper_repository:
    description: Repository whose latest release provides the dumper binary for the file tree
    default: linuxserver-playground/dumper
  out_dir:
    description: Host directory mounted at /out
    required: true
  image_root:
    description: >-
      The repository's root/ directory (the files copied to / in the image). Mounted read-only as IMAGE_ROOT so the
      harness knows which s6 units are this image's own; skipped when the directory does not exist.
    default: root

outputs:
  success:
    description: "true when the test report says success (or tests are disabled in the manifest)"
    value: ${{ steps.test.outputs.success }}
  report:
    description: Path to test.<arch>.json
    value: ${{ steps.test.outputs.report }}
  summary:
    description: Markdown table of the test results
    value: ${{ steps.test.outputs.summary }}

runs:
  using: composite
  steps:
    - name: Test ${{ inputs.arch }}
      id: test
      shell: bash
      run: ${GITHUB_ACTION_PATH}/test.sh
      env:
        IMAGE: ${{ inputs.image }}
        ARCH: ${{ inputs.arch }}
        MODE: ${{ inputs.mode }}
        MANIFEST: ${{ inputs.manifest }}
        PREVIOUS_PACKAGES_URL: ${{ inputs.previous_packages_url }}
        CI_IMAGE: ${{ inputs.ci_image }}
        DUMPER_REPOSITORY: ${{ inputs.dumper_repository }}
        OUT_DIR: ${{ inputs.out_dir }}
        IMAGE_ROOT: ${{ inputs.image_root }}
