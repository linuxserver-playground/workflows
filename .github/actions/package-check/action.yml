name: package-check
description: The package table steps of a live build. `compare` (reason=packages, before publishing) compares the fresh amd64 package table with the committed package_versions.txt at the built commit and says whether the run should release; `commit` (after every successful release) commits the fresh table to the live branch as "Update package versions [skip ci]" when it differs. Neither dispatches a build.

inputs:
  mode:
    description: compare or commit
    required: true
  out_dir:
    description: Directory holding the merged bundle-<arch> artifacts (package_versions.<arch>.txt)
    required: true
  repo_dir:
    description: Checkout of the image repository on the live branch, with push credentials
    required: true
  sha:
    description: compare only; the commit that was built; package_versions.txt is read from it
    default: ""
  branch:
    description: commit only; the live branch to commit to
    default: ""
  previous_tag:
    description: compare only; previous release tag of the branch; its package_versions.arm64.txt asset is compared for reporting
    default: ""
  repository:
    default: ${{ github.repository }}

outputs:
  changed:
    description: "compare: true when the committed table differs from the fresh one (or is missing)"
    value: ${{ steps.check.outputs.changed }}
  status:
    description: "compare: same, different or missing"
    value: ${{ steps.check.outputs.status }}
  fresh_hash:
    value: ${{ steps.check.outputs.fresh_hash }}
  committed_hash:
    value: ${{ steps.check.outputs.committed_hash }}
  committed:
    description: "commit: true when a commit was pushed"
    value: ${{ steps.check.outputs.committed }}
  commit_sha:
    description: "commit: the Update package versions commit, when one was pushed"
    value: ${{ steps.check.outputs.commit_sha }}

runs:
  using: composite
  steps:
    - name: Package table (${{ inputs.mode }})
      id: check
      shell: bash
      run: ${GITHUB_ACTION_PATH}/package_check.sh "${MODE}"
      env:
        MODE: ${{ inputs.mode }}
        OUT_DIR: ${{ inputs.out_dir }}
        REPO_DIR: ${{ inputs.repo_dir }}
        SHA: ${{ inputs.sha }}
        BRANCH: ${{ inputs.branch }}
        PREVIOUS_TAG: ${{ inputs.previous_tag }}
        REPOSITORY: ${{ inputs.repository }}
