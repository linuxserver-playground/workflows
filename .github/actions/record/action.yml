name: record
description: Derive record.json (CONVENTIONS §6) from the bundle files in out_dir with `builder record`. It holds the package tables, the diff against the previous release of the branch, a grype scan of both architectures and the base image's layer digests, so the hub ingests the release without deriving anything. Never fails the build; a part it cannot derive is listed in the record's `errors` and the hub derives it.

inputs:
  out_dir:
    description: Directory holding build.json and the merged bundle-<arch> files
    required: true
  previous_tag:
    description: The previous release of the branch; its build.json and record.json (or syft documents) are downloaded for the diff
    default: ""
  repository:
    default: ${{ github.repository }}
  github_token:
    default: ${{ github.token }}
  grype_version:
    default: 0.121.0
  grype_sha256:
    description: sha256 of grype_<version>_linux_amd64.tar.gz
    default: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519

outputs:
  record:
    description: Path to record.json, empty when it could not be written
    value: ${{ steps.record.outputs.record }}

runs:
  using: composite
  steps:
    - name: Install grype
      id: grype
      shell: bash
      run: |
        set -euo pipefail
        dir="${RUNNER_TEMP}/grype-bin"
        mkdir -p "${dir}"
        curl -sSfL --retry 3 -o "${dir}/grype.tgz" \
          "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
        echo "${GRYPE_SHA256}  ${dir}/grype.tgz" | sha256sum -c -
        tar -xzf "${dir}/grype.tgz" -C "${dir}" grype
        echo "${dir}" >> "${GITHUB_PATH}"
        echo "date=$(date -u +%F)" >> "${GITHUB_OUTPUT}"
      env:
        GRYPE_VERSION: ${{ inputs.grype_version }}
        GRYPE_SHA256: ${{ inputs.grype_sha256 }}
      continue-on-error: true

    - name: Restore the grype vulnerability database
      # One entry a day per repository. An older one is restored when today's is missing; `builder record`
      # updates a database more than 30 hours old before it scans, and the post step saves the updated one.
      if: steps.grype.outcome == 'success'
      uses: actions/cache@v4
      with:
        path: ~/.cache/grype/db
        key: grype-db-${{ steps.grype.outputs.date }}
        restore-keys: grype-db-

    - name: Fetch the previous release
      id: previous
      if: inputs.previous_tag != ''
      shell: bash
      run: |
        set -euo pipefail
        dir="${RUNNER_TEMP}/lsio-previous"
        rm -rf "${dir}" && mkdir -p "${dir}"
        if ! gh release download "${PREVIOUS_TAG}" -R "${REPOSITORY}" -D "${dir}" -p build.json; then
          echo "::warning::previous release ${PREVIOUS_TAG} has no build.json; the record diffs this build as the first"
          exit 0
        fi
        # record.json carries the previous package tables; releases made before records have the syft documents.
        gh release download "${PREVIOUS_TAG}" -R "${REPOSITORY}" -D "${dir}" -p record.json 2>/dev/null \
          || gh release download "${PREVIOUS_TAG}" -R "${REPOSITORY}" -D "${dir}" -p 'packages.*.json.gz' || true
        echo "dir=${dir}" >> "${GITHUB_OUTPUT}"
      env:
        PREVIOUS_TAG: ${{ inputs.previous_tag }}
        REPOSITORY: ${{ inputs.repository }}
        GH_TOKEN: ${{ inputs.github_token }}
      continue-on-error: true

    - name: Write record.json
      id: record
      shell: bash
      run: |
        set -euo pipefail
        args=("${OUT_DIR}")
        [[ -n "${PREVIOUS_DIR}" ]] && args+=(--previous "${PREVIOUS_DIR}")
        command -v grype >/dev/null || args+=(--no-scan)
        python3 -m builder record "${args[@]}"
        echo "record=${OUT_DIR}/record.json" >> "${GITHUB_OUTPUT}"
      env:
        OUT_DIR: ${{ inputs.out_dir }}
        PREVIOUS_DIR: ${{ steps.previous.outputs.dir }}
      continue-on-error: true
