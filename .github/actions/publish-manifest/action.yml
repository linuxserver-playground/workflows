name: publish-manifest
description: Create the multi-platform indexes and arch twins for the whole tag set from the per-arch staging images.

inputs:
  image_path:
    required: true
  primary_tag:
    description: The unprefixed primary tag
    required: true
  tags:
    description: JSON array of every unprefixed tag to publish (includes the primary tag)
    required: true
  platforms:
    description: JSON array of platforms (amd64, arm64)
    required: true
  sources:
    description: JSON object arch -> staging reference pushed by build-arch; empty means the arch jobs pushed <image_path>:<arch prefix>-<primary_tag> themselves
    default: ""
  description:
    description: org.opencontainers.image.description set as an index annotation so the GHCR package page shows it
    default: ""

outputs:
  index_digest: { value: "${{ steps.publish.outputs.index_digest }}" }
  published: { value: "${{ steps.publish.outputs.published }}" }

runs:
  using: composite
  steps:
    - name: Publish tags
      id: publish
      shell: bash
      run: ${GITHUB_ACTION_PATH}/publish.sh
      env:
        IMAGE_PATH: ${{ inputs.image_path }}
        PRIMARY_TAG: ${{ inputs.primary_tag }}
        TAGS: ${{ inputs.tags }}
        PLATFORMS: ${{ inputs.platforms }}
        SOURCES: ${{ inputs.sources }}
        DESCRIPTION: ${{ inputs.description }}
