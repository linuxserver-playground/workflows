name: artifact-upload
description: >-
  actions/upload-artifact with a second attempt. The artifact service fails an upload now and then after the
  action's own retries (README "Network retries"); the second attempt overwrites whatever the first left behind.

inputs:
  name:
    description: The artifact's name
    required: true
  path:
    description: The files to upload, one glob per line
    required: true
  retention-days:
    description: Days the artifact is kept
    default: ""
  if-no-files-found:
    description: warn (default), error or ignore
    default: warn

outputs:
  artifact-id:
    description: The uploaded artifact's id
    value: ${{ steps.first.outcome == 'success' && steps.first.outputs.artifact-id || steps.second.outputs.artifact-id }}
  artifact-url:
    description: The uploaded artifact's download page
    value: ${{ steps.first.outcome == 'success' && steps.first.outputs.artifact-url || steps.second.outputs.artifact-url }}

runs:
  using: composite
  steps:
    - name: Upload
      id: first
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}

    - name: Wait before the second attempt
      if: steps.first.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::artifact upload failed once; trying again in 20 s"
        sleep 20

    - name: Upload (retry)
      id: second
      if: steps.first.outcome == 'failure'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: ${{ inputs.if-no-files-found }}
        overwrite: true
