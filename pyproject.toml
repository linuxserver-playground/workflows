[project]
name = "lsio-workflows"
version = "0.1.0"
description = "Scripts behind the LinuxServer v2 shared GitHub Actions workflows."
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pyyaml==6.0.3",
  "shellcheck-py==0.11.0.1",
  "actionlint-py",
  "lsio-builder @ git+https://github.com/linuxserver-playground/builder@main",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Standalone scripts only; nothing is importable as a package. Without this setuptools refuses the
# flat layout because it sees fixtures/ and templates/ as packages.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", ".github/actions/manifest", ".github/actions/emit-bundle", ".github/actions/notify-control", ".github/actions/release", ".github/actions/test-arch", ".github/actions/build-arch"]

[tool.ruff]
line-length = 120
